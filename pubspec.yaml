name: farmhub
description: FarmHub - Integrated Farm Management Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0

  # Backend & Sync (Firebase)
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  
  # Local Database (Offline-first)
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2

  # UI / UX & Theming
  google_fonts: ^6.2.1
  fl_chart: ^0.66.2
  gap: ^3.0.0
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  timezone: ^0.10.1

  # Device Hardware & Permissions
  image_picker: ^1.0.7
  permission_handler: ^11.3.0
  flutter_local_notifications: ^19.5.0

  # Export Features
  csv: ^6.0.0
  pdf: ^3.11.3
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
